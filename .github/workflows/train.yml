name: Neural network experiment
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - "train.py"
      - "quality_gate.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/train.yml"
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Keep NumPy/OpenBLAS reductions single-threaded across CI runners.
    env:
      OPENBLAS_NUM_THREADS: "1"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Record BLAS backend and CPU SIMD capabilities to investigate cross-run MSE drift.
      - name: Record NumPy runtime
        run: python -c 'import numpy as np; np.show_runtime()'
      - run: python -m unittest discover -s tests -v
      - run: python train.py
      - run: python quality_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-results
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
