name: Neural network experiment
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - "train.py"
      - "quality_gate.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/train.yml"
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python train.py
      - run: python quality_gate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-results
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
