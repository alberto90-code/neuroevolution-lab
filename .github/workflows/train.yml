name: Neural network experiment
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    paths:
      - "train.py"
      - "quality_gate.py"
      - "tests/**"
      - "neuroevolution_ai/**"
      - "requirements.txt"
      - ".github/workflows/train.yml"
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: neural-experiment-${{ github.ref }}
      cancel-in-progress: false
    # Keep OpenBLAS single-threaded and use the same kernel on Haswell/SkylakeX runners.
    # This reduces one known source of cross-run MSE drift; it is not a bitwise guarantee.
    env:
      OPENBLAS_NUM_THREADS: "1"
      OPENBLAS_CORETYPE: "Haswell"
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node.js 24)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 (Node.js 24)
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Record BLAS backend and CPU SIMD capabilities to investigate cross-run MSE drift.
      - name: Record NumPy runtime
        run: python -c 'import numpy as np; np.show_runtime()'
      - run: python -m unittest discover -s tests -v
      - run: python train.py
      - run: python quality_gate.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6 (Node.js 24)
        if: always()
        with:
          name: model-results
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
